<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>HUNTR/X &amp; Smiling Critters: The Minish Cap 3D!</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%231b4332' stroke='%23ffd026' stroke-width='3'/%3E%3Cpath d='M12 44 C14 22 28 8 48 10 C42 18 44 26 52 28 C44 34 46 44 48 44 Z' fill='%232fb344' stroke='%23143620' stroke-width='3' stroke-linejoin='round'/%3E%3Crect x='10' y='40' width='40' height='8' rx='4' fill='%23ffd026' stroke='%23b87100' stroke-width='2.5'/%3E%3Ccircle cx='50' cy='12' r='6' fill='%23ffd026' stroke='%23b87100' stroke-width='2'/%3E%3Cellipse cx='48' cy='24' rx='7' ry='4' fill='%23ff922b' stroke='%235c2b00' stroke-width='2'/%3E%3Ccircle cx='40' cy='21' r='4.5' fill='%23ffffff' stroke='%23141624' stroke-width='2'/%3E%3Ccircle cx='41' cy='21' r='2' fill='%23141624'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <div id="app" class="app-root">
      <canvas id="game-canvas" aria-label="HUNTR/X &amp; Smiling Critters: The Minish Cap 3D World"></canvas>
      <div id="ui-layer" class="ui-layer">
        <div id="title-screen" class="title-screen">
          <div id="title-banner" class="title-banner">
            <div class="title-kicker">&#127913; HUNTR/X &amp; SMILING CRITTERS MINISH CAP &#10024;</div>
            <h1 class="title-heading">THE MINISH CAP 3D!</h1>
            <div class="title-sub">Rumi, CatNap, DogDay &amp; Derpy Tiger&#39;s Tiny Shrink-Stump Adventure!</div>
          </div>
          <div id="title-actions" class="title-actions">
            <button
              id="btn-title-play"
              type="button"
              class="kid-btn kid-btn-play"
              aria-label="Play HUNTR/X &amp; Smiling Critters: The Minish Cap 3D!"
            >
              <span class="btn-icon" aria-hidden="true">&#9654;</span>
              <span class="btn-label">PLAY!</span>
            </button>
            <button
              id="btn-title-voice"
              type="button"
              class="kid-btn kid-btn-sky title-voice-btn"
              aria-label="Replay Voice Guide"
            >
              <span class="btn-icon" aria-hidden="true">&#128266;</span>
              <span class="btn-label">VOICE</span>
            </button>
          </div>
        </div>
        <div id="hud" class="hud-root" hidden></div>
        <div id="boss-banner" class="boss-banner" hidden></div>
        <div id="roulette-modal" class="ui-modal" hidden></div>
        <div id="pause-modal" class="ui-modal" hidden></div>
        <div id="victory-modal" class="ui-modal" hidden></div>
        <div id="voice-subtitle" class="voice-subtitle" hidden></div>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
